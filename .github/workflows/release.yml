name: release

# Build prebuilt `tael` binaries on every `v*` tag and attach them to the
# matching GitHub Release. This is what makes `cargo binstall tael-cli` fast:
# binstall downloads one of these archives instead of compiling the bundled
# DuckDB C++ amalgamation (~1.4 GB of object code) from source.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Fail fast if the pushed tag doesn't match the workspace version, so we never
  # publish a `v{version}` release whose binaries binstall can't resolve (the
  # binstall URL is derived from the crate version, not the tag).
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag cargo=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match workspace version '$version' in Cargo.toml"
            exit 1
          fi

  # Create the GitHub Release once, up front. If the matrix jobs each create it
  # on demand, all four race: `softprops/action-gh-release` looks the release up
  # by tag, a draft is not discoverable by tag, so several jobs conclude it's
  # missing and create duplicates. The losers then fail to finalize with
  # `already_exists`, splitting the archives across two releases for the same
  # tag. Creating it here means the matrix only ever uploads into an existing,
  # already-published release.
  create-release:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true

  build:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on older glibc (22.04) for broader binary compatibility.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          # Both macOS targets build on the Apple-Silicon runner (macos-14):
          # aarch64 natively, x86_64 via cross-compile. macos-13 (Intel) runners
          # are scarce and can queue for hours, so we avoid them.
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          # No Windows target: the WAL dependency (walrus-rust) uses unix-only
          # positioned file I/O (std::os::unix::fs::FileExt), so tael does not
          # build on Windows — via this workflow or `cargo install`.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Build only the CLI crate (it pulls in tael-server). The `gui` feature is
      # opt-in (default = []), so the prebuilt binary stays headless and never
      # links webkit/GTK — that's what lets `cargo binstall tael-cli` run on a
      # server/container without `libgdk-3.so.0`. No Tauri build deps needed.
      # Native target on each runner, so bundled native deps compile with the
      # host toolchain.
      - name: Build
        run: cargo build --release --locked -p tael-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="tael-cli-v${version}-${{ matrix.target }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/tael" "$stage/"
          cp README.md "$stage/" 2>/dev/null || true
          tar czf "$stage.tar.gz" "$stage"
          echo "ASSET=$stage.tar.gz" >> "$GITHUB_ENV"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

  # Publish to crates.io via Trusted Publishing: no long-lived API token lives
  # in repo secrets. `rust-lang/crates-io-auth-action` exchanges this workflow's
  # GitHub OIDC identity for a short-lived crates.io token (auto-revoked when
  # the job ends). crates.io authorizes it against per-crate Trusted Publisher
  # configs pinned to this repo + workflow file + environment, so the config
  # below must stay in sync with what's registered on crates.io for
  # tael-server, tael-gui, and tael-cli.
  #
  # Runs only after every binary target is built and attached: a crates.io
  # release is permanent (yank-only), so we never want a published version whose
  # `cargo binstall` archives are missing because a build job failed.
  publish:
    name: publish to crates.io
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # mint the OIDC token for Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # tael-gui is a Tauri crate, so `cargo publish`'s verification build links
      # webkit/GTK. The binary matrix never needs these (it builds only tael-cli,
      # whose `gui` feature is off by default) but publishing does, because the
      # verification step compiles every crate in the workspace.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # `--workspace` publishes tael-server, tael-gui, and tael-cli in dependency
      # order and waits for each to be indexed before the next one's verification
      # build resolves it from the registry. tael-test is `publish = false`, so
      # it's skipped. Requires cargo >= 1.90.
      - name: Publish
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
